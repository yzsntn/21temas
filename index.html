<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Piedra Cúbica de Punta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="21temas-style.css">

<div class="app" id="app">
  <div class="halo"></div>
  <canvas id="three" role="img" aria-label="Piedra cúbica de punta en tres dimensiones. Cada cara y arista guarda un tema."></canvas>
  <div class="grain"></div>
  <div class="frame"></div>

  <header class="mast">
    <p class="eyebrow">Grado de Compañero</p>
    <h1>La Piedra Cúbica <em>de Punta</em></h1>
    <p class="lede">Veintiún temas grabados en una sola piedra.</p>
  </header>

  <div class="tools" id="tools">
    <button class="btn" id="spin" type="button" aria-pressed="true">Pausar</button>
    <button class="btn" id="reset" type="button">Vista inicial</button>
  </div>

  <p class="nogl" id="nogl" hidden>No se pudo cargar la vista 3D. Elige un tema del índice inferior para leerlo.</p>

  <div class="dock">
    <p class="cap" id="cap" aria-live="polite">Arrastra para girar · toca una cara o arista</p>
    <nav class="rail" id="rail" aria-label="Los 21 temas"></nav>
    <ul class="legend">
      <li style="--c: var(--c-pir)"><i></i>Pirámide · 4</li>
      <li style="--c: var(--c-ari)"><i></i>Aristas · 12</li>
      <li style="--c: var(--c-car)"><i></i>Caras · 5</li>
    </ul>
  </div>

  <aside class="sheet" id="sheet" aria-label="Detalle del tema" aria-hidden="true">
    <div class="sheet-in" id="sheetBody"></div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="21temas-script.js"></script>


</body></html>
